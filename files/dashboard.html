<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELO Subscription Panel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background-color: #121212; color: #e0e0e0; font-family: system-ui, -apple-system, sans-serif; }
.card { background-color: #1e1e1e; border: 1px solid #333; }
.btn-custom { background-color: #bb86fc; color: #121212; }
.btn-custom:hover { background-color: #9a67ea; color: #121212; }
</style>
</head>
<body>
<div class="container py-5">
<div class="card p-4 shadow-lg">
<h2 class="text-center mb-4">MELO subscription panel</h2>
<div class="mb-3">
<label class="form-label">MELO direct link:</label>
<div class="input-group">
<input type="text" class="form-control bg-dark text-white border-secondary" id="meloLink" value="https://{{HOST}}/{{PASSWORD}}" readonly>
<button class="btn btn-custom" onclick="copyText('meloLink')">Copy</button>
</div>
</div>
<div class="mb-3">
<label class="form-label">Clash subscription link:</label>
<div class="input-group">
<input type="text" class="form-control bg-dark text-white border-secondary" id="clashLink" value="https://{{HOST}}/{{PASSWORD}}?clash" readonly>
<button class="btn btn-custom" onclick="copyText('clashLink')">Copy</button>
</div>
</div>
<div class="mb-3">
<label class="form-label">Sing-box subscription link:</label>
<div class="input-group">
<input type="text" class="form-control bg-dark text-white border-secondary" id="sbLink" value="https://{{HOST}}/{{PASSWORD}}?singbox" readonly>
<button class="btn btn-custom" onclick="copyText('sbLink')">Copy</button>
</div>
</div>
</div>
</div>
<script>
function copyText(id) {
const input = document.getElementById(id);
input.select();
document.execCommand('copy');
}
</script>
</body>
</html>
