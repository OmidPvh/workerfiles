<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MELO SECURE GATEWAY</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body, html { width: 100%; height: 100%; overflow: hidden; background-color: #050508; font-family: 'Orbitron', sans-serif; color: #00ffcc; }
canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
.ui-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center; pointer-events: none; width: 90%; max-width: 600px; padding: 30px; background: rgba(5, 5, 8, 0.75); border: 1px solid rgba(0, 255, 204, 0.2); border-radius: 12px; box-shadow: 0 0 40px rgba(0, 255, 204, 0.15); backdrop-filter: blur(10px); }
h1 { font-size: 2.2rem; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 15px; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
p { font-size: 0.85rem; letter-spacing: 2px; line-height: 1.6; color: #8899af; margin-bottom: 25px; }
.status-container { display: flex; justify-content: space-around; margin-top: 15px; border-top: 1px solid rgba(0, 255, 204, 0.15); padding-top: 20px; }
.status-item { text-align: center; }
.status-label { font-size: 0.65rem; color: #8899af; text-transform: uppercase; margin-bottom: 5px; letter-spacing: 1px; }
.status-value { font-size: 1.1rem; font-weight: bold; color: #00ffcc; text-shadow: 0 0 5px rgba(0, 255, 204, 0.3); }
.pulse { display: inline-block; width: 12px; height: 12px; background-color: #00ffcc; border-radius: 50%; margin-right: 10px; box-shadow: 0 0 12px #00ffcc; animation: beat 1.5s infinite; }
@keyframes beat { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.4; } 100% { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
<canvas id="netCanvas"></canvas>
<div class="ui-overlay">
<h1><span class="pulse"></span>MELO ACTIVE</h1>
<p>QUANTUM TUNNEL ENCRYPTION STABLE — DATALINK SHIELD ENGAGED</p>
<div class="status-container">
<div class="status-item">
<div class="status-label">UPLINK</div>
<div class="status-value">SECURE</div>
</div>
<div class="status-item">
<div class="status-label">LATENCY</div>
<div class="status-value">12 ms</div>
</div>
<div class="status-item">
<div class="status-label">CIPHER</div>
<div class="status-value">MELO-256</div>
</div>
</div>
</div>
<script>
const canvas = document.getElementById('netCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
const particleCount = 80;
const maxDistance = 140;
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let mouse = { x: null, y: null };
window.addEventListener('resize', () => {
width = canvas.width = window.innerWidth;
height = canvas.height = window.innerHeight;
});
window.addEventListener('mousemove', (e) => {
mouse.x = e.clientX;
mouse.y = e.clientY;
});
window.addEventListener('mouseout', () => {
mouse.x = null;
mouse.y = null;
});
class Particle {
constructor() {
this.x = Math.random() * width;
this.y = Math.random() * height;
this.vx = (Math.random() - 0.5) * 0.7;
this.vy = (Math.random() - 0.5) * 0.7;
this.radius = Math.random() * 2 + 1;
}
update() {
this.x += this.vx;
this.y += this.vy;
if (this.x < 0 || this.x > width) this.vx *= -1;
if (this.y < 0 || this.y > height) this.vy *= -1;
}
draw() {
ctx.beginPath();
ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
ctx.fillStyle = '#00ffcc';
ctx.shadowBlur = 4;
ctx.shadowColor = '#00ffcc';
ctx.fill();
ctx.shadowBlur = 0;
}
}
function init() {
particles = [];
for (let i = 0; i < particleCount; i++) {
particles.push(new Particle());
}
}
function animate() {
ctx.clearRect(0, 0, width, height);
for (let i = 0; i < particles.length; i++) {
particles[i].update();
particles[i].draw();
for (let j = i + 1; j < particles.length; j++) {
const dx = particles[i].x - particles[j].x;
const dy = particles[i].y - particles[j].y;
const dist = Math.sqrt(dx * dx + dy * dy);
if (dist < maxDistance) {
ctx.beginPath();
ctx.moveTo(particles[i].x, particles[i].y);
ctx.lineTo(particles[j].x, particles[j].y);
ctx.strokeStyle = `rgba(0, 255, 204, ${1 - dist / maxDistance})`;
ctx.lineWidth = 0.5;
ctx.stroke();
}
}
if (mouse.x !== null && mouse.y !== null) {
const mdx = particles[i].x - mouse.x;
const mdy = particles[i].y - mouse.y;
const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
if (mdist < 200) {
ctx.beginPath();
ctx.moveTo(particles[i].x, particles[i].y);
ctx.lineTo(mouse.x, mouse.y);
ctx.strokeStyle = `rgba(0, 255, 204, ${(1 - mdist / 200) * 0.4})`;
ctx.lineWidth = 0.8;
ctx.stroke();
}
}
}
requestAnimationFrame(animate);
}
init();
animate();
</script>
</body>
</html>
